<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Повідомлення</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
textarea:focus{outline:none}
</style>
</helmet>
<div style="{{ vars }}; min-height: 900px; background: var(--bg); color: var(--text); font-family: 'Golos Text', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line)">
    <a href="Home.dc.html" style="font: 600 20px 'Literata', serif; color: var(--strong); text-decoration: none">новелка<span style="color: var(--accent)">.</span></a>
    <nav aria-label="Сайт" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1">
      <a href="Home.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Головна</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Каталог</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Бібліотека</a>
      <a href="Studio.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Студія</a>
    </nav>
    <a href="Inbox.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Вхідні · 3</a>
    <a href="#" aria-current="page" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: var(--panel2); color: var(--strong); text-decoration: none; font-weight: 600">Повідомлення</a>
    <a href="GlobalChat.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Загальний чат</a>
    <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--panel2); color: var(--text); display: grid; place-items: center; cursor: pointer">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg></sc-if>
    </button>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 20px 20px; align-items: stretch">
    <aside aria-label="Розмови" style="flex: 0 1 320px; min-width: 260px; background: var(--panel); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; gap: 8px; margin-bottom: 6px">
        <label style="flex: 1; display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--panel2)">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Пошук розмов</span>
          <input placeholder="Пошук" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; outline: none">
        </label>
        <button type="button" aria-label="Нове повідомлення" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--accent); color: var(--onAccent); font: 600 20px 'Golos Text', sans-serif">+</button>
      </div>
      <sc-for list="{{ chats }}" as="c" hint-placeholder-count="4">
        <button type="button" aria-current="{{ c.current }}" onClick="{{ c.pick }}" style="display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border: 0; border-radius: 12px; background: {{ c.bg }}; color: inherit; text-align: left; font: inherit; cursor: pointer">
          <span aria-hidden="true" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: {{ c.radius }}; background: {{ c.avatarBg }}; color: {{ c.avatarInk }}; font-weight: 600">{{ c.letter }}</span>
          <span style="min-width: 0">
            <span style="display: block; font-weight: 600; color: var(--strong)">{{ c.name }}</span>
            <span style="display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.last }}</span>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
            <span style="font-size: 12px; color: var(--muted)">{{ c.when }}</span>
            <span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: {{ c.badgeBg }}; color: var(--onAccent); font-size: 11px; font-weight: 600; text-align: center; line-height: 18px">{{ c.badge }}</span>
          </span>
        </button>
      </sc-for>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; background: var(--panel); border-radius: 14px; display: flex; flex-direction: column; min-height: 760px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line)">
        <span aria-hidden="true" style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: {{ open.radius }}; background: {{ open.avatarBg }}; color: {{ open.avatarInk }}; font-weight: 600">{{ open.letter }}</span>
        <div style="flex: 1"><div style="font-weight: 600; color: var(--strong)">{{ open.name }}</div><div style="font-size: 12px; color: var(--muted)">{{ open.about }}</div></div>
      </div>
      <div style="flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 10px; justify-content: flex-end">
        <sc-for list="{{ open.messages }}" as="m" hint-placeholder-count="4">
          <div style="align-self: {{ m.side }}; max-width: 70%; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; color: var(--muted); align-self: {{ m.side }}">{{ m.who }} · {{ m.when }}</span>
            <div style="padding: 10px 14px; border-radius: 14px; background: {{ m.bg }}; color: {{ m.ink }}; line-height: 1.5">{{ m.text }}</div>
          </div>
        </sc-for>
      </div>
      <form style="display: flex; gap: 10px; align-items: flex-end; padding: 14px 18px; border-top: 1px solid var(--line)">
        <label style="flex: 1; display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Повідомлення</span>
          <textarea rows="2" placeholder="Напишіть повідомлення" style="flex: 1; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--text); font: inherit; resize: none"></textarea>
        </label>
        <button type="button" style="height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--accent); color: var(--onAccent); font: 600 14px 'Golos Text', sans-serif">Надіслати</button>
      </form>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { light: false, open: 0 };
  }
  renderVals() {
    const dark = { bg: '#0F1115', panel: '#171A20', panel2: '#1F232B', line: '#2A2F39', text: '#E8EAEE', strong: '#F1F2F5', muted: '#A3A9B6', accent: '#8EA6FF', onAccent: '#0B0D12', mine: '#8EA6FF', mineInk: '#0B0D12', theirs: '#23272F', theirsInk: '#E8EAEE', soft: 'rgba(142,166,255,0.10)' };
    const light = { bg: '#F3F4F6', panel: '#FFFFFF', panel2: '#F1F2F5', line: '#E3E5EA', text: '#15171C', strong: '#0B0D12', muted: '#5B6170', accent: '#2A4BD7', onAccent: '#FFFFFF', mine: '#2A4BD7', mineInk: '#FFFFFF', theirs: '#EEF0F3', theirsInk: '#15171C', soft: '#EEF2FD' };
    const t = this.state.light ? light : dark;
    const vars = Object.entries(t).map(([k, v]) => '--' + k + ':' + v).join(';');
    const me = (text, when) => ({ text, when, who: 'ви', side: 'flex-end', bg: 'var(--mine)', ink: 'var(--mineInk)' });
    const them = (who, text, when) => ({ text, when, who, side: 'flex-start', bg: 'var(--theirs)', ink: 'var(--theirsInk)' });
    const list = [
      { name: '@mavka', about: 'читачка · надсилає правки', letter: 'М', avatarBg: '#203B2C', avatarInk: '#BDF0D0', radius: '50%', when: '14:20', unread: 2,
        messages: [them('@mavka', 'Привіт! У 12-й главі «Велика Лінза» з великої — це ж не ім’я?', '14:02'), me('Так, ваша правда, прийняв правку. Дякую!', '14:10'), them('@mavka', 'А в 13-й ще «журнал» — його теж з великої треба, це назва?', '14:18'), them('@mavka', 'Можу надіслати правкою, якщо так.', '14:20')] },
      { name: 'Команда $panrid', about: 'чат команди перекладу · 3 учасники', letter: 'P', avatarBg: '#1E3550', avatarInk: '#BBD6FF', radius: '12px', when: 'вчора', unread: 0,
        messages: [them('@lis', 'Вичитав 11-ту, можна публікувати.', 'вчора'), me('Опублікував. Беру 12-ту.', 'вчора')] },
      { name: '@lis', about: 'редактор у команді $panrid', letter: 'Л', avatarBg: '#2A2340', avatarInk: '#D9CCFF', radius: '50%', when: 'пн', unread: 0,
        messages: [them('@lis', 'Глянь словник «Мага води» — там два записи на одне ім’я.', 'пн'), me('Об’єднав, дякую.', 'пн')] }
    ];
    const i = this.state.open;
    const chats = list.map((c, k) => ({
      ...c, last: c.messages[c.messages.length - 1].text, badge: c.unread ? String(c.unread) : '',
      badgeBg: c.unread ? 'var(--accent)' : 'transparent', bg: k === i ? 'var(--soft)' : 'transparent', current: k === i ? 'true' : 'false',
      pick: () => this.setState({ open: k })
    }));
    return {
      vars, chats, open: list[i],
      isDark: !this.state.light, isLight: this.state.light,
      themeLabel: this.state.light ? 'Темна тема' : 'Світла тема',
      toggleTheme: () => this.setState({ light: !this.state.light })
    };
  }
}
</script>
</body>
</html>
