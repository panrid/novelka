<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Робоче місце: лише переклад</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
</style>
</helmet>
<div style="{{ vars }}; min-height: 1010px; background: var(--bg); color: var(--text); font-family: 'Golos Text', system-ui, sans-serif; font-size: 14px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line)">
    <a href="Workspace.dc.html" aria-label="Назад до двох колонок" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; color: var(--text)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; min-width: 220px">
      <div style="font-size: 12px; color: var(--muted)">Доглядач маяка · глава 12</div>
      <div style="font-weight: 600; color: var(--strong)">Лінза, що пам'ятає світло</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px">
      <span>Перевірено 4 з 6 абзаців</span>
      <span style="width: 120px; height: 6px; border-radius: 6px; background: var(--panel2)"><span style="display: block; width: 66%; height: 6px; border-radius: 6px; background: var(--accent)"></span></span>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; color: var(--text)"><input type="checkbox" checked="{{ showOriginal }}" onChange="{{ toggleOriginal }}" style="width: 18px; height: 18px; accent-color: var(--accent)"> Оригінал під абзацом</label>
    <button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: var(--onAccent); font: 600 14px 'Golos Text', sans-serif">Опублікувати</button>
    <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--panel2); color: var(--text); display: grid; place-items: center; cursor: pointer">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg></sc-if>
    </button>
  </header>

  <main style="max-width: 820px; margin: 0 auto; padding: 32px 24px 48px">
    <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 24px 56px; font-size: 12px; color: var(--muted)">
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: var(--muted)"></span>машинний</span>
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: var(--accent)"></span>перевірено</span>
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--warn)"></span>є пропозиція</span>
    </div>
    <h1 style="margin: 0 0 24px 56px; font: 600 30px/1.25 'Literata', serif; color: var(--strong)">Лінза, що пам'ятає світло</h1>

    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
      <div style="display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 16px; margin-bottom: 14px">
        <button type="button" onClick="{{ r.pick }}" aria-label="Абзац {{ r.n }}: {{ r.stateLabel }}" title="{{ r.stateLabel }}" style="height: 32px; margin-top: 6px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: flex-end; gap: 6px; color: var(--muted); font: 500 12px 'Golos Text', sans-serif; cursor: pointer">
          {{ r.n }}<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: {{ r.dotRadius }}; background: {{ r.dot }}; box-shadow: {{ r.dotRing }}"></span>
        </button>
        <div style="padding: 8px 14px; border-radius: 12px; background: {{ r.bg }}; box-shadow: {{ r.ring }}">
          <p lang="uk" style="margin: 0; font: 18px/1.7 'Literata', serif; color: var(--read); text-align: justify; hyphens: auto">{{ r.ua }}</p>
          <sc-if value="{{ r.showEn }}" hint-placeholder-val="{{ false }}">
            <p lang="en" style="margin: 8px 0 0; padding-top: 8px; border-top: 1px solid var(--line); font: 14px/1.6 'Literata', serif; color: var(--muted)">{{ r.en }}</p>
          </sc-if>
          <sc-if value="{{ r.active }}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px">
              <button type="button" style="height: 32px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--accent); color: var(--onAccent); font: 600 12px 'Golos Text', sans-serif">Позначити перевіреним</button>
              <button type="button" style="height: 32px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--panel2); color: var(--text); font: 500 12px 'Golos Text', sans-serif">Інший варіант</button>
              <button type="button" style="height: 32px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--panel2); color: var(--text); font: 500 12px 'Golos Text', sans-serif">Вичитати абзац</button>
            </div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1010}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { light: false, active: 2, original: true };
  }
  renderVals() {
    const dark = { bg: '#0F1115', panel: '#171A20', panel2: '#1F232B', line: '#2A2F39', text: '#E8EAEE', strong: '#F1F2F5', muted: '#A3A9B6', accent: '#8EA6FF', onAccent: '#0B0D12', warn: '#F2C46B', read: '#DADDE3', activeBg: '#151922' };
    const light = { bg: '#F3F4F6', panel: '#FFFFFF', panel2: '#F1F2F5', line: '#E3E5EA', text: '#15171C', strong: '#0B0D12', muted: '#5B6170', accent: '#2A4BD7', onAccent: '#FFFFFF', warn: '#9A6200', read: '#15171C', activeBg: '#FFFFFF' };
    const t = this.state.light ? light : dark;
    const vars = Object.entries(t).map(([k, v]) => '--' + k + ':' + v).join(';');
    const states = {
      machine: { label: 'машинний', dot: 'var(--muted)', radius: '50%', ring: 'none' },
      checked: { label: 'перевірено', dot: 'var(--accent)', radius: '3px', ring: 'none' },
      offer: { label: 'є пропозиція', dot: 'transparent', radius: '50%', ring: 'inset 0 0 0 2px var(--warn)' }
    };
    const source = [
      ['Маяк стояв темним уже третю ніч, коли Ліна нарешті піднялася сходами.', 'The lighthouse had been dark for three nights when Lina finally climbed the stairs.', 'checked'],
      ['— Ти спізнилася, — не обертаючись, сказав майстер Орест. Він натирав велику лінзу ганчіркою, що колись була сорочкою.', '“You’re late,” said Master Orest without turning around. He was polishing the great lens with a rag that had once been a shirt.', 'checked'],
      ['— Пором спізнився, — відповіла вона. — На цьому острові все спізнюється.', '“The ferry was late,” she said. “Everything is late on this island.”', 'offer'],
      ['Він засміявся сухо, наче хтось гортав сторінки. — Тоді спізнюватимемося разом. Подай олію.', 'He laughed, a dry sound like pages turning. “Then we’ll be late together. Hand me the oil.”', 'checked'],
      ['Унизу під тонкою ковдрою туману спала гавань, і десь у ній один раз ударив дзвін.', 'Below them the harbour slept under a thin blanket of fog, and somewhere in it a bell rang once.', 'machine'],
      ['Ліна подала бляшанку й сіла на холодну сходинку. Звідси було видно, як світло з лінзи помалу набирає силу.', 'Lina handed him the tin and sat on the cold step. From here she could watch the light gather strength in the lens.', 'checked']
    ];
    const rows = source.map((row, index) => {
      const active = this.state.active === index;
      const s = states[row[2]];
      return {
        n: index + 1, ua: row[0], en: row[1], active,
        showEn: active && this.state.original,
        stateLabel: s.label, dot: s.dot, dotRadius: s.radius, dotRing: s.ring,
        bg: active ? 'var(--activeBg)' : 'transparent',
        ring: active ? 'inset 0 0 0 1.5px var(--accent)' : 'none',
        pick: () => this.setState({ active: index })
      };
    });
    return {
      vars, rows,
      showOriginal: this.state.original,
      toggleOriginal: () => this.setState({ original: !this.state.original }),
      isDark: !this.state.light, isLight: this.state.light,
      themeLabel: this.state.light ? 'Темна тема' : 'Світла тема',
      toggleTheme: () => this.setState({ light: !this.state.light })
    };
  }
}
</script>
</body>
</html>
