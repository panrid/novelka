<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Сторінка новели</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #E8EAEE; font-family: 'Golos Text', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 0; flex-shrink: 0">
    <a href="PhoneHome.dc.html" aria-label="Назад" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: #E8EAEE">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <button type="button" aria-label="Ще" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #E8EAEE; font: 600 18px 'Golos Text', sans-serif">···</button>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; gap: 16px">
      <span aria-hidden="true" style="flex-shrink: 0; width: 112px; height: 164px; border-radius: 12px; background: #1F3A4A; display: grid; place-items: center; font: 600 44px 'Literata', serif; color: #BFE3F2">Д</span>
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <h1 style="margin: 0; font: 600 22px/1.2 'Literata', serif; color: #F1F2F5">Доглядач маяка</h1>
        <div style="color: #A3A9B6">Сакура Юкі</div>
        <div style="color: #A3A9B6; font-size: 13px">40 глав з 64 · виходить</div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px">
          <span style="padding: 3px 10px; border-radius: 999px; background: #1F232B; font-size: 12px; color: #C4C9D4">фентезі</span>
          <span style="padding: 3px 10px; border-radius: 999px; background: #1F232B; font-size: 12px; color: #C4C9D4">повільне життя</span>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <a href="Main.dc.html" style="flex: 1; height: 48px; display: grid; place-items: center; border-radius: 14px; background: #8EA6FF; color: #0B0D12; font-weight: 600; font-size: 15px; text-decoration: none">Продовжити · гл. 12</a>
      <button type="button" aria-label="У бібліотеку" style="width: 48px; height: 48px; border: 1px solid #2E3440; border-radius: 14px; background: transparent; color: #E8EAEE; display: grid; place-items: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>
      </button>
    </div>

    <p lang="uk" style="margin: 0; color: #C4C9D4; line-height: 1.55">Учениця доглядача маяка на туманному острові вчиться тримати світло — і дізнається, чому попередній доглядач зник.</p>

    <nav aria-label="Розділи новели" style="display: flex; gap: 4px; border-bottom: 1px solid #23272F">
      <a href="#" aria-current="page" style="padding: 10px 12px; color: #F1F2F5; font-weight: 600; text-decoration: none; box-shadow: inset 0 -2px 0 #8EA6FF">Глави</a>
      <a href="#" style="padding: 10px 12px; color: #A3A9B6; text-decoration: none">Персонажі</a>
      <a href="#" style="padding: 10px 12px; color: #A3A9B6; text-decoration: none">Обговорення</a>
    </nav>

    <div style="display: flex; flex-direction: column">
      <div style="padding: 6px 0; font-size: 12px; color: #7D8492; letter-spacing: 0.03em">ТОМ 1 · ПЕРША ЗИМА</div>
      <sc-for list="{{ chapters }}" as="c" hint-placeholder-count="6">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 4px 0; border-bottom: 1px solid #1A1D23; color: {{ c.color }}; text-decoration: none">
          <span style="width: 28px; color: #7D8492; font-variant-numeric: tabular-nums">{{ c.n }}</span>
          <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.title }}</span>
          <span style="font-size: 12px; color: {{ c.markColor }}">{{ c.mark }}</span>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const read = { color: '#7D8492', markColor: '#7D8492', mark: 'прочитано' };
    const now = { color: '#F1F2F5', markColor: '#8EA6FF', mark: '34%' };
    const next = { color: '#E8EAEE', markColor: '#7D8492', mark: '' };
    const chapters = [
      { n: 9, title: 'Шторм над гаванню', ...read },
      { n: 10, title: 'Олія і ґніт', ...read },
      { n: 11, title: 'Пором о шостій', ...read },
      { n: 12, title: 'Лінза, що пам’ятає світло', ...now },
      { n: 13, title: 'Журнал доглядача', ...next },
      { n: 14, title: 'Сіль', ...next },
      { n: 15, title: 'Туманний дзвін', ...next }
    ];
    return { chapters };
  }
}
</script>
</body>
</html>
