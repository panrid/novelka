<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Вхідні</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
</style>
</helmet>
<div style="{{ vars }}; min-height: 900px; background: var(--bg); color: var(--text); font-family: 'Golos Text', system-ui, sans-serif; font-size: 14px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line)">
    <a href="Home.dc.html" style="font: 600 20px 'Literata', serif; color: var(--strong); text-decoration: none">новелка<span style="color: var(--accent)">.</span></a>
    <nav aria-label="Сайт" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1">
      <a href="Home.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Головна</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Каталог</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Бібліотека</a>
      <a href="Studio.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Студія</a>
    </nav>
    <a href="#" aria-current="page" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: var(--panel2); color: var(--strong); text-decoration: none; font-weight: 600">Вхідні</a>
    <a href="Messages.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Повідомлення · 2</a>
    <a href="Settings.dc.html" aria-label="Налаштування" style="display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #2A2340; color: #D9CCFF; font: 600 14px 'Golos Text', sans-serif; text-decoration: none">П</a>
    <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--panel2); color: var(--text); display: grid; place-items: center; cursor: pointer">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg></sc-if>
    </button>
  </header>

  <div style="max-width: 1100px; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
    <nav aria-label="Що показувати" style="flex: 0 1 220px; min-width: 180px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="6">
        <button type="button" aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}" style="display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: {{ f.bg }}; color: {{ f.color }}; font: 500 14px 'Golos Text', sans-serif; text-align: left; cursor: pointer">
          <span>{{ f.label }}</span><span style="font-size: 12px; color: var(--muted)">{{ f.count }}</span>
        </button>
      </sc-for>
      <a href="Settings.dc.html" style="margin-top: 12px; padding: 0 12px; font-size: 13px; color: var(--accent)">Що й куди надсилати</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px">
        <h1 style="margin: 0; font: 600 26px/1.25 'Literata', serif; color: var(--strong)">Вхідні</h1>
        <div style="display: flex; gap: 8px">
          <button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--panel2); color: var(--text); font: 500 13px 'Golos Text', sans-serif">Усе прочитано</button>
          <button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: var(--text); font: 500 13px 'Golos Text', sans-serif; box-shadow: inset 0 0 0 1px var(--line)">Архів</button>
        </div>
      </div>
      <div style="background: var(--panel); border-radius: 14px; padding: 6px">
        <sc-for list="{{ items }}" as="n" hint-placeholder-count="7">
          <a href="#" style="display: grid; grid-template-columns: 10px 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 10px; border-radius: 10px; color: inherit; text-decoration: none; background: {{ n.bg }}">
            <span aria-label="{{ n.readLabel }}" style="width: 8px; height: 8px; border-radius: 50%; background: {{ n.dot }}"></span>
            <span aria-hidden="true" style="display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: {{ n.iconBg }}; color: {{ n.iconInk }}; font: 600 15px 'Literata', serif">{{ n.letter }}</span>
            <span style="min-width: 0">
              <span style="display: block; color: var(--strong); font-weight: {{ n.weight }}">{{ n.title }}</span>
              <span style="display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ n.text }}</span>
            </span>
            <span style="font-size: 12px; color: var(--muted); white-space: nowrap">{{ n.when }}</span>
          </a>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { light: false, filter: 'all' };
  }
  renderVals() {
    const dark = { bg: '#0F1115', panel: '#171A20', panel2: '#1F232B', line: '#2A2F39', text: '#E8EAEE', strong: '#F1F2F5', muted: '#A3A9B6', accent: '#8EA6FF', onAccent: '#0B0D12', unread: 'rgba(142,166,255,0.06)' };
    const light = { bg: '#F3F4F6', panel: '#FFFFFF', panel2: '#F1F2F5', line: '#E3E5EA', text: '#15171C', strong: '#0B0D12', muted: '#5B6170', accent: '#2A4BD7', onAccent: '#FFFFFF', unread: '#F6F8FE' };
    const t = this.state.light ? light : dark;
    const vars = Object.entries(t).map(([k, v]) => '--' + k + ':' + v).join(';');
    const all = [
      { kind: 'chapters', unread: true, letter: 'М', iconBg: '#1E3550', iconInk: '#BBD6FF', title: 'Маг води — нова глава 52', text: 'Бібліотека Руна · переклад $panrid', when: '2 год тому' },
      { kind: 'edits', unread: true, letter: 'П', iconBg: '#203B2C', iconInk: '#BDF0D0', title: '@mavka надіслала 3 правки', text: 'Доглядач маяка, глава 12 — «лінзу» з малої літери', when: '3 год тому' },
      { kind: 'replies', unread: true, letter: '@', iconBg: '#2A2340', iconInk: '#D9CCFF', title: '@lis відповів на ваш коментар', text: '«Згоден, сцена з поромом — найкраща в томі»', when: 'сьогодні' },
      { kind: 'studio', unread: false, letter: 'С', iconBg: '#3D3018', iconInk: '#FFE2A8', title: 'Переклад глав 13–15 завершено', text: 'Доглядач маяка · 3 глави в чернетках', when: 'вчора' },
      { kind: 'studio', unread: false, letter: 'О', iconBg: '#3D3018', iconInk: '#FFE2A8', title: 'В оригіналі 2 нові глави', text: 'Маг води · Syosetu · глави 209–210', when: 'вчора' },
      { kind: 'edits', unread: false, letter: 'П', iconBg: '#203B2C', iconInk: '#BDF0D0', title: 'Вашу правку прийнято', text: 'Творець магії, глава 180 · дякує команда $panrid', when: '2 дні' },
      { kind: 'system', unread: false, letter: 'Ш', iconBg: '#23272F', iconInk: '#C4C9D4', title: 'Вам нараховано [N] шагів', text: 'Від власника сайту · на переклад', when: '4 дні' }
    ];
    const names = [['all', 'Усі'], ['chapters', 'Нові глави'], ['edits', 'Правки'], ['replies', 'Відповіді'], ['studio', 'Студія'], ['system', 'Шаги й сайт']];
    const f = this.state.filter;
    const filters = names.map(([key, label]) => ({
      label, count: key === 'all' ? all.filter((n) => n.unread).length + ' нових' : String(all.filter((n) => n.kind === key).length),
      pressed: f === key ? 'true' : 'false', bg: f === key ? 'var(--panel2)' : 'transparent', color: f === key ? 'var(--strong)' : 'var(--text)',
      pick: () => this.setState({ filter: key })
    }));
    const items = all.filter((n) => f === 'all' || n.kind === f).map((n) => ({
      ...n, dot: n.unread ? 'var(--accent)' : 'transparent', readLabel: n.unread ? 'нове' : 'прочитане',
      bg: n.unread ? 'var(--unread)' : 'transparent', weight: n.unread ? '600' : '500'
    }));
    return {
      vars, filters, items,
      isDark: !this.state.light, isLight: this.state.light,
      themeLabel: this.state.light ? 'Темна тема' : 'Світла тема',
      toggleTheme: () => this.setState({ light: !this.state.light })
    };
  }
}
</script>
</body>
</html>
