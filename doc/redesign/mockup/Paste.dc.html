<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Оригінал глави</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
input:focus,textarea:focus,select:focus{outline:2px solid #8EA6FF;outline-offset:1px}
</style>
</helmet>
<div style="{{ vars }}; min-height: 960px; background: var(--bg); color: var(--text); font-family: 'Golos Text', system-ui, sans-serif; font-size: 14px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line)">
    <a href="Studio.dc.html" aria-label="Новелка · Студія" style="display: flex; align-items: center; font: 600 20px 'Literata', serif; color: var(--strong); text-decoration: none">новелка<span style="color: var(--accent)">.</span><span style="margin-left: 8px; padding: 3px 8px; border-radius: 6px; background: var(--panel2); font: 600 11px 'Golos Text', sans-serif; letter-spacing: 0.08em; color: var(--accent)">СТУДІЯ</span></a>
    <nav aria-label="Шлях" style="display: flex; align-items: center; gap: 8px; color: var(--muted); flex: 1; min-width: 200px">
      <a href="Studio.dc.html" style="color: var(--muted); text-decoration: none">Студія</a><span aria-hidden="true">/</span>
      <a href="Translate.dc.html" style="color: var(--muted); text-decoration: none">Доглядач маяка</a><span aria-hidden="true">/</span>
      <span style="color: var(--strong); font-weight: 600">Оригінал</span>
    </nav>
    <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--panel2); color: var(--text); display: grid; place-items: center; cursor: pointer">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg></sc-if>
    </button>
  </header>

  <div style="display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 20px 32px; align-items: flex-start">
    <main style="flex: 999 1 640px; min-width: 0; background: var(--panel); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px">
        <h1 style="margin: 0; font: 600 22px/1.3 'Literata', serif; color: var(--strong)">{{ heading }}</h1>
        <span style="font-size: 13px; color: var(--muted)">{{ status }}</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end">
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; color: var(--muted)">Мова оригіналу</span>
          <select style="height: 42px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); font: inherit">
            <option>Англійська</option><option>Японська</option><option>Китайська</option><option>Корейська</option>
          </select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; color: var(--muted)">Номер глави</span>
          <input type="number" value="{{ current.n }}" style="width: 100px; height: 42px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); font: inherit">
        </label>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: var(--muted)">Заголовок</span>
        <input lang="en" value="{{ current.title }}" placeholder="Chapter {{ current.n }}: …" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); font: 16px 'Literata', serif">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; color: var(--muted)">Текст глави — кожен рядок стане абзацом</span>
        <textarea lang="en" rows="17" placeholder="Вставте текст глави" style="box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--text); font: 16px/1.7 'Literata', serif; resize: vertical">{{ current.text }}</textarea>
      </label>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
        <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: var(--onAccent); font: 600 15px 'Golos Text', sans-serif">Зберегти</button>
        <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; color: var(--text); font: 500 15px 'Golos Text', sans-serif; box-shadow: inset 0 0 0 1px var(--line)">Зберегти й перекласти</button>
        <button type="button" onClick="{{ nextNew }}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; color: var(--text); font: 500 15px 'Golos Text', sans-serif; box-shadow: inset 0 0 0 1px var(--line)">Зберегти й до наступної</button>
        <span style="font-size: 12px; color: var(--muted)">Оригінал бачить лише команда перекладу.</span>
      </div>
    </main>

    <aside aria-label="Глави оригіналу" style="flex: 1 1 300px; max-width: 360px; background: var(--panel); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 8px">
        <b style="font-weight: 600; color: var(--strong)">Глави</b>
        <span style="font-size: 12px; color: var(--muted)">оригінал є в 22 з 64</span>
      </div>
      <sc-for list="{{ chapters }}" as="c" hint-placeholder-count="9">
        <button type="button" onClick="{{ c.pick }}" aria-current="{{ c.current }}" style="display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: 10px; background: {{ c.bg }}; color: var(--text); text-align: left; font: inherit; cursor: pointer">
          <span style="width: 26px; color: var(--muted); font-variant-numeric: tabular-nums">{{ c.n }}</span>
          <span style="flex: 1; min-width: 0">
            <span lang="en" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{ c.titleColor }}">{{ c.label }}</span>
            <span style="display: block; font-size: 12px; color: {{ c.stateColor }}">{{ c.state }}</span>
          </span>
        </button>
      </sc-for>
      <button type="button" onClick="{{ nextNew }}" style="margin-top: 8px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--accent); font: 500 14px 'Golos Text', sans-serif; box-shadow: inset 0 0 0 1px var(--line); cursor: pointer">+ Нова глава</button>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { light: false, picked: 23 };
  }
  renderVals() {
    const dark = { bg: '#0F1115', panel: '#171A20', panel2: '#1F232B', line: '#2E3440', text: '#E8EAEE', strong: '#F1F2F5', muted: '#A3A9B6', accent: '#8EA6FF', onAccent: '#0B0D12', field: '#0F1115', soft: 'rgba(142,166,255,0.12)', warn: '#F2C46B' };
    const light = { bg: '#F3F4F6', panel: '#FFFFFF', panel2: '#F1F2F5', line: '#D6DAE3', text: '#15171C', strong: '#0B0D12', muted: '#5B6170', accent: '#2A4BD7', onAccent: '#FFFFFF', field: '#FFFFFF', soft: '#EEF2FD', warn: '#7A4B00' };
    const t = this.state.light ? light : dark;
    const vars = Object.entries(t).map(([k, v]) => '--' + k + ':' + v).join(';');
    const list = [
      { n: 15, title: 'Chapter 15: Fog Bell', state: 'перекладено', text: 'The fog came in at noon and did not leave for three days.' },
      { n: 16, title: 'Chapter 16: A Letter From the Mainland', state: 'перекладено', text: 'The letter had been opened once and sealed again.' },
      { n: 17, title: 'Chapter 17: Night Watch', state: 'перекладається', text: 'Lina kept the first watch alone.' },
      { n: 18, title: 'Chapter 18: The Second Keeper', state: 'є оригінал', text: 'Nobody on the island said his name aloud.' },
      { n: 19, title: 'Chapter 19: Low Tide', state: 'є оригінал', text: 'At low tide the old pier showed its bones.' },
      { n: 20, title: 'Chapter 20: What the Light Saw', state: 'є оригінал', text: 'The light had seen everything, Orest said, and remembered most of it.' },
      { n: 21, title: 'Chapter 21: The Mainland Ship', state: 'є оригінал', text: 'The ship from the mainland arrived on a Tuesday, which nobody on the island had expected.\nLina saw it first, a grey shape against a grey sea, and ran down the stairs two at a time.\n“Master Orest! There’s a ship!”' },
      { n: 22, title: 'Chapter 22: Strangers', state: 'є оригінал', text: 'Three people came ashore, and none of them looked at the lighthouse.' },
      { n: 23, title: '', state: 'нова', text: '' }
    ];
    const picked = list.find((c) => c.n === this.state.picked) || list[list.length - 1];
    const color = (state) => state === 'нова' ? 'var(--accent)' : state === 'є оригінал' ? 'var(--muted)' : state === 'перекладається' ? 'var(--warn)' : 'var(--muted)';
    const chapters = list.map((c) => {
      const on = c.n === picked.n;
      return {
        n: c.n, label: c.title || 'Нова глава', state: c.state === 'нова' ? 'вставте оригінал' : c.state,
        stateColor: color(c.state), titleColor: c.title ? 'var(--text)' : 'var(--accent)',
        bg: on ? 'var(--soft)' : 'transparent', current: on ? 'true' : 'false',
        pick: () => this.setState({ picked: c.n })
      };
    });
    const isNew = picked.state === 'нова';
    return {
      vars, chapters, current: picked,
      heading: isNew ? 'Нова глава ' + picked.n : 'Оригінал глави ' + picked.n,
      status: isNew ? 'ще не збережено' : picked.state + ' · збережено 2 дні тому',
      nextNew: () => this.setState({ picked: 23 }),
      isDark: !this.state.light, isLight: this.state.light,
      themeLabel: this.state.light ? 'Темна тема' : 'Світла тема',
      toggleTheme: () => this.setState({ light: !this.state.light })
    };
  }
}
</script>
</body>
</html>
