<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Головна</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0F1115; color: #E8EAEE; font-family: 'Golos Text', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; flex-shrink: 0">
    <a href="#" style="font: 600 22px 'Literata', serif; color: #F1F2F5; text-decoration: none">новелка<span style="color: #8EA6FF">.</span></a>
    <a href="#" aria-label="Пошук" style="display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; color: #E8EAEE">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </a>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 22px">
    <a href="Main.dc.html" style="display: flex; gap: 14px; padding: 14px; border-radius: 18px; background: #171A20; color: inherit; text-decoration: none">
      <span aria-hidden="true" style="flex-shrink: 0; width: 72px; height: 104px; border-radius: 10px; background: #1F3A4A; display: grid; place-items: center; font: 600 28px 'Literata', serif; color: #BFE3F2">Д</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #A3A9B6">Продовжити читання</span>
        <span style="font: 600 18px/1.25 'Literata', serif; color: #F1F2F5">Доглядач маяка</span>
        <span style="color: #C4C9D4">Глава 12 · Лінза, що пам'ятає світло</span>
        <span style="margin-top: auto; height: 4px; border-radius: 4px; background: #2A2F39"><span style="display: block; width: 34%; height: 4px; border-radius: 4px; background: #8EA6FF"></span></span>
      </span>
    </a>

    <section aria-labelledby="new-ch">
      <h2 id="new-ch" style="margin: 0 0 10px; font-size: 16px; font-weight: 600">Нові глави у ваших новелах</h2>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{ fresh }}" as="f" hint-placeholder-count="3">
          <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-radius: 12px; color: inherit; text-decoration: none">
            <span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 56px; border-radius: 8px; background: {{ f.cover }}; display: grid; place-items: center; font: 600 16px 'Literata', serif; color: {{ f.ink }}">{{ f.letter }}</span>
            <span style="flex: 1; min-width: 0">
              <span style="display: block; font-weight: 500; color: #F1F2F5">{{ f.title }}</span>
              <span style="display: block; font-size: 13px; color: #A3A9B6">{{ f.chapter }}</span>
            </span>
            <span style="font-size: 12px; color: #7D8492">{{ f.when }}</span>
          </a>
        </sc-for>
      </div>
    </section>

    <section aria-labelledby="popular">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px">
        <h2 id="popular" style="margin: 0; font-size: 16px; font-weight: 600">Читають цього тижня</h2>
        <a href="#" style="font-size: 13px">Каталог</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{ popular }}" as="p" hint-placeholder-count="3">
          <a href="PhoneNovel.dc.html" style="display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none">
            <span aria-hidden="true" style="aspect-ratio: 2 / 3; border-radius: 10px; background: {{ p.cover }}; display: grid; place-items: center; font: 600 26px 'Literata', serif; color: {{ p.ink }}">{{ p.letter }}</span>
            <span style="font-size: 13px; line-height: 1.3; color: #E8EAEE">{{ p.title }}</span>
          </a>
        </sc-for>
      </div>
    </section>
  </main>

  <nav aria-label="Розділи" style="flex-shrink: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 4px 12px; border-top: 1px solid #1F232B; background: #0F1115">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <a href="#" aria-current="{{ t.current }}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: {{ t.color }}; text-decoration: none; font-size: 11px">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 7px; box-shadow: inset 0 0 0 1.8px {{ t.color }}"></span>
        {{ t.label }}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const fresh = [
      { title: 'Маг води', chapter: 'Глава 52 · Бібліотека Руна', when: 'сьогодні', letter: 'М', cover: '#1E3550', ink: '#BBD6FF' },
      { title: 'Творець магії', chapter: 'Глава 209', when: 'вчора', letter: 'Т', cover: '#3A2340', ink: '#F0C8FF' },
      { title: 'Майстер магічної інженерії', chapter: 'Глава 14 · Село Кайна', when: '2 дні', letter: 'М', cover: '#3D3018', ink: '#FFE2A8' }
    ];
    const popular = [
      { title: 'Маг води', letter: 'М', cover: '#1E3550', ink: '#BBD6FF' },
      { title: 'Мати навчання', letter: 'М', cover: '#203B2C', ink: '#BDF0D0' },
      { title: 'Творець магії', letter: 'Т', cover: '#3A2340', ink: '#F0C8FF' }
    ];
    const on = '#F1F2F5';
    const off = '#7D8492';
    const tabs = ['Головна', 'Каталог', 'Бібліотека', 'Вхідні', 'Я'].map((label, i) => ({
      label, color: i === 0 ? on : off, current: i === 0 ? 'page' : 'false'
    }));
    return { fresh, popular, tabs };
  }
}
</script>
</body>
</html>
