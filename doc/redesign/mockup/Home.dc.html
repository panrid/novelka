<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Головна</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1115}
a{color:#8EA6FF}a:hover{color:#B7C6FF}
</style>
</helmet>
<div style="{{ vars }}; min-height: 1100px; background: var(--bg); color: var(--text); font-family: 'Golos Text', system-ui, sans-serif; font-size: 14px">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line)">
    <a href="#" style="font: 600 20px 'Literata', serif; color: var(--strong); text-decoration: none">новелка<span style="color: var(--accent)">.</span></a>
    <nav aria-label="Сайт" style="display: flex; flex-wrap: wrap; gap: 4px">
      <a href="#" aria-current="page" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; background: var(--panel2); color: var(--strong); text-decoration: none; font-weight: 600">Головна</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Каталог</a>
      <a href="#" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Бібліотека</a>
      <a href="Studio.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 10px; color: var(--muted); text-decoration: none">Студія</a>
    </nav>
    <label style="flex: 1 1 240px; max-width: 420px; margin-left: auto; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--panel2)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color: var(--muted)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Пошук</span>
      <input placeholder="Назва, автор, тег" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; outline: none">
    </label>
    <a href="#" aria-label="Вхідні · 2 нові" style="position: relative; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; color: var(--text)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 21h4"></path></svg>
      <span style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent)"></span>
    </a>
    <button type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--panel2); color: var(--text); display: grid; place-items: center; cursor: pointer">
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"></path></svg></sc-if>
    </button>
  </header>

  <div style="max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 32px">
    <section aria-labelledby="continue">
      <h2 id="continue" style="margin: 0 0 12px; font-size: 18px; font-weight: 600; color: var(--strong)">Продовжити читання</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px">
        <sc-for list="{{ continuing }}" as="c" hint-placeholder-count="3">
          <a href="Novel.dc.html" style="display: flex; gap: 14px; padding: 14px; border-radius: 14px; background: var(--panel); color: inherit; text-decoration: none">
            <span aria-hidden="true" style="flex-shrink: 0; width: 64px; height: 92px; border-radius: 10px; background: {{ c.cover }}; display: grid; place-items: center; font: 600 24px 'Literata', serif; color: {{ c.ink }}">{{ c.letter }}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span style="font: 600 17px/1.25 'Literata', serif; color: var(--strong)">{{ c.title }}</span>
              <span style="color: var(--muted)">{{ c.chapter }}</span>
              <span style="margin-top: auto; height: 4px; border-radius: 4px; background: var(--panel2)"><span style="display: block; width: {{ c.width }}; height: 4px; border-radius: 4px; background: var(--accent)"></span></span>
            </span>
          </a>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <section aria-labelledby="fresh" style="flex: 999 1 560px; min-width: 0">
        <h2 id="fresh" style="margin: 0 0 12px; font-size: 18px; font-weight: 600; color: var(--strong)">Нові глави</h2>
        <div style="background: var(--panel); border-radius: 14px; padding: 6px">
          <sc-for list="{{ fresh }}" as="f" hint-placeholder-count="6">
            <a href="Novel.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 10px; color: inherit; text-decoration: none">
              <span aria-hidden="true" style="flex-shrink: 0; width: 40px; height: 56px; border-radius: 8px; background: {{ f.cover }}; display: grid; place-items: center; font: 600 16px 'Literata', serif; color: {{ f.ink }}">{{ f.letter }}</span>
              <span style="flex: 1; min-width: 0">
                <span style="display: block; font-weight: 600; color: var(--strong)">{{ f.title }}</span>
                <span style="display: block; color: var(--muted)">{{ f.chapter }}</span>
              </span>
              <span style="font-size: 12px; color: var(--muted)">{{ f.team }}</span>
              <span style="width: 80px; text-align: right; font-size: 12px; color: var(--muted)">{{ f.when }}</span>
            </a>
          </sc-for>
        </div>
      </section>
      <section aria-labelledby="popular" style="flex: 1 1 360px; min-width: 0">
        <h2 id="popular" style="margin: 0 0 12px; font-size: 18px; font-weight: 600; color: var(--strong)">Читають цього тижня</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
          <sc-for list="{{ popular }}" as="p" hint-placeholder-count="6">
            <a href="Novel.dc.html" style="display: flex; flex-direction: column; gap: 6px; color: inherit; text-decoration: none">
              <span aria-hidden="true" style="aspect-ratio: 2 / 3; border-radius: 10px; background: {{ p.cover }}; display: grid; place-items: center; font: 600 28px 'Literata', serif; color: {{ p.ink }}">{{ p.letter }}</span>
              <span style="font-size: 13px; line-height: 1.3; color: var(--text)">{{ p.title }}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { light: false };
  }
  renderVals() {
    const dark = { bg: '#0F1115', panel: '#171A20', panel2: '#1F232B', line: '#2A2F39', text: '#E8EAEE', strong: '#F1F2F5', muted: '#A3A9B6', accent: '#8EA6FF', onAccent: '#0B0D12' };
    const light = { bg: '#F3F4F6', panel: '#FFFFFF', panel2: '#F1F2F5', line: '#E3E5EA', text: '#15171C', strong: '#0B0D12', muted: '#5B6170', accent: '#2A4BD7', onAccent: '#FFFFFF' };
    const t = this.state.light ? light : dark;
    const vars = Object.entries(t).map(([k, v]) => '--' + k + ':' + v).join(';');
    const covers = {
      d: { letter: 'Д', cover: '#1F3A4A', ink: '#BFE3F2' },
      w: { letter: 'М', cover: '#1E3550', ink: '#BBD6FF' },
      m: { letter: 'Т', cover: '#3A2340', ink: '#F0C8FF' },
      e: { letter: 'М', cover: '#3D3018', ink: '#FFE2A8' },
      l: { letter: 'М', cover: '#203B2C', ink: '#BDF0D0' },
      s: { letter: 'С', cover: '#40252A', ink: '#FFC9CF' }
    };
    const continuing = [
      { ...covers.d, title: 'Доглядач маяка', chapter: 'Глава 12 · 34%', width: '34%' },
      { ...covers.w, title: 'Маг води', chapter: 'Глава 48 · 80%', width: '80%' },
      { ...covers.m, title: 'Творець магії', chapter: 'Глава 203 · 10%', width: '10%' }
    ];
    const fresh = [
      { ...covers.w, title: 'Маг води', chapter: 'Глава 52 · Бібліотека Руна', team: '$panrid', when: '2 год тому' },
      { ...covers.d, title: 'Доглядач маяка', chapter: 'Глава 12 · Лінза, що пам’ятає світло', team: '$panrid', when: 'сьогодні' },
      { ...covers.m, title: 'Творець магії', chapter: 'Глава 209', team: '$panrid', when: 'вчора' },
      { ...covers.e, title: 'Майстер магічної інженерії', chapter: 'Глава 10 · Галерея', team: '$panrid', when: 'вчора' },
      { ...covers.l, title: 'Мати навчання', chapter: 'Глава 1 · Доброго ранку, брате', team: '$panrid', when: '2 дні' }
    ];
    const popular = [
      { ...covers.w, title: 'Маг води' }, { ...covers.m, title: 'Творець магії' }, { ...covers.d, title: 'Доглядач маяка' },
      { ...covers.e, title: 'Майстер магічної інженерії' }, { ...covers.l, title: 'Мати навчання' }, { ...covers.s, title: 'Сіль і попіл' }
    ];
    return {
      vars, continuing, fresh, popular,
      isDark: !this.state.light, isLight: this.state.light,
      themeLabel: this.state.light ? 'Темна тема' : 'Світла тема',
      toggleTheme: () => this.setState({ light: !this.state.light })
    };
  }
}
</script>
</body>
</html>
