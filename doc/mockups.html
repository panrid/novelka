<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новелка — макети</title>
<style>
:root {
  --bg: #121412; --surface: #1b1e1b; --surface-2: #242824; --line: #2f342f;
  --text: #e9e7df; --muted: #9a9d94; --faint: #6d7069;
  --accent: #8fb07f; --accent-ink: #10150e; --warn: #d9a45b; --danger: #d9776b;
  --add: rgba(143,176,127,.22); --del: rgba(217,119,107,.22);
  --page: #0b0c0b; --page-text: #c9c8c0;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page); color: var(--page-text); font: 15px/1.5 var(--sans); padding: 32px 16px 64px; }
.intro { max-width: 900px; margin: 0 auto 32px; }
.intro h1 { font: 600 28px/1.2 var(--serif); color: var(--text); margin-bottom: 8px; }
.intro p { color: var(--muted); max-width: 680px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 32px; justify-content: center; }
figure { width: 360px; max-width: 100%; }
figcaption { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
figcaption b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
figcaption ul { padding-left: 18px; }

/* phone */
.phone { position: relative; height: 740px; border-radius: 28px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; }
.status { height: 28px; flex: none; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; padding: 6px 20px 0; }
.screen { flex: 1; overflow: hidden; position: relative; }
.pad { padding: 0 16px; }
.top { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; flex: none; }
.top h2 { font: 600 17px/1 var(--sans); flex: 1; }
.top .ic { color: var(--muted); font-size: 18px; }
.logo { font: 700 19px/1 var(--serif); flex: 1; }
.logo i { color: var(--accent); font-style: normal; }
.tabbar { flex: none; height: 60px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5,1fr);
  font-size: 10.5px; color: var(--faint); text-align: center; padding-top: 8px; background: var(--bg); }
.tabbar span::before { content: attr(data-i); display: block; font-size: 18px; line-height: 22px; }
.tabbar .on { color: var(--text); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); vertical-align: top; }

h3 { font: 600 15px/1.2 var(--sans); display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 10px; }
h3 small { font-weight: 400; font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .sm { font-size: 12.5px; } .xs { font-size: 11px; }
.row { display: flex; gap: 10px; align-items: center; }
.between { justify-content: space-between; }

.cover { flex: none; border-radius: 6px; aspect-ratio: 2/3; position: relative; overflow: hidden;
  display: flex; align-items: flex-end; padding: 6px; font: 600 11px/1.15 var(--serif); color: #fff;
  background: linear-gradient(160deg, var(--c1, #3c5a73), var(--c2, #1d2b38)); }
.cover::after { content: ""; position: absolute; right: -20%; top: 12%; width: 55%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.18); }
.c2 { --c1: #7a4b5c; --c2: #2d1a22; } .c3 { --c1: #5c6e3c; --c2: #1f2915; } .c4 { --c1: #8a6a3a; --c2: #2e2213; } .c5 { --c1: #4b4d7a; --c2: #1a1b2f; }
.shelf { display: flex; gap: 10px; overflow: hidden; }
.shelf > div { width: 96px; flex: none; }
.shelf .cover { width: 96px; }
.shelf p { font-size: 12.5px; line-height: 1.25; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.continue { display: flex; gap: 12px; background: var(--surface); border-radius: 12px; padding: 10px; align-items: center; }
.continue .cover { width: 44px; }
.bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; } .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

.rel { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: center; }
.rel .cover { width: 38px; }
.rel b { font-weight: 500; font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel > div:not(.cover) { min-width: 0; flex: 1; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--text); white-space: nowrap; }
.chip.ghost { background: none; border: 1px solid var(--line); color: var(--muted); }
.chip.acc { background: var(--add); color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 15px; }
.btn.sec { background: var(--surface-2); color: var(--text); font-weight: 500; }
.btn.sm { height: 34px; font-size: 13.5px; border-radius: 9px; padding: 0 12px; }
.btn.danger { background: var(--surface-2); color: var(--danger); }

.card { background: var(--surface); border-radius: 12px; padding: 12px; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.label { font-size: 12.5px; color: var(--muted); margin: 14px 0 6px; }
.list > div { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.list > div:last-child { border: 0; }
.list .v { color: var(--muted); font-size: 13px; }
.seg { display: grid; grid-auto-flow: column; background: var(--surface); border-radius: 10px; padding: 3px; font-size: 13px; text-align: center; }
.seg span { padding: 6px 0; border-radius: 8px; color: var(--muted); }
.seg .on { background: var(--surface-2); color: var(--text); }

.fab { position: absolute; right: 16px; bottom: 16px; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--surface-2);
  display: flex; align-items: center; gap: 6px; font-size: 13.5px; box-shadow: 0 6px 18px rgba(0,0,0,.45); }

/* reader */
.reader { font: 17px/1.75 var(--serif); color: #dcdad1; }
.reader p { margin-bottom: 14px; }
.reader h4 { font: 600 20px/1.3 var(--serif); margin: 8px 0 18px; }
.overlay-top, .overlay-bottom { position: absolute; left: 0; right: 0; background: rgba(27,30,27,.97); backdrop-filter: blur(6px); }
.overlay-top { top: 0; height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.overlay-bottom { bottom: 0; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
.sel { background: rgba(143,176,127,.35); border-radius: 2px; }
.pop { position: absolute; background: var(--surface-2); border-radius: 10px; display: flex; font-size: 13px; box-shadow: 0 8px 22px rgba(0,0,0,.5); }
.pop span { padding: 9px 12px; } .pop span + span { border-left: 1px solid var(--line); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 18px 18px 0 0; padding: 10px 16px 16px; box-shadow: 0 -10px 30px rgba(0,0,0,.5); }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
.mark { border-left: 3px solid var(--warn); padding-left: 10px; margin-left: -13px; }
ins { text-decoration: none; background: var(--add); color: #cfe3c4; border-radius: 2px; }
del { background: var(--del); color: #f0c2bb; border-radius: 2px; }

.editor { font: 14.5px/1.65 var(--serif); color: #dcdad1; }
.editor p { margin-bottom: 12px; }
.imgblock { border: 1px dashed var(--line); border-radius: 10px; height: 110px; display: flex; align-items: center; justify-content: center; color: var(--muted); font: 13px var(--sans); margin-bottom: 12px;
  background: linear-gradient(135deg, #2a3240, #1b2027); }
.toolbar { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--line); background: var(--surface); display: flex; gap: 4px; padding: 8px 10px; font-size: 13px; }
.toolbar span { padding: 7px 10px; border-radius: 8px; background: var(--surface-2); }

.stat { background: var(--surface); border-radius: 12px; padding: 12px; }
.stat b { font-size: 20px; display: block; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.money { font: 600 34px/1 var(--sans); letter-spacing: -.5px; }
.pos { color: var(--accent); } .neg { color: var(--text); }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
.big-av { width: 64px; height: 64px; font-size: 26px; background: linear-gradient(135deg, #5c6e3c, #2d3a1c); }
.pill-state { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.pill-state.ok { color: var(--accent); } .pill-state.run { color: var(--warn); }
.range { position: relative; height: 26px; margin: 8px 0 2px; }
.range::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 2px; background: var(--line); }
.range .done { position: absolute; left: 0; top: 11px; height: 4px; width: 30%; background: var(--faint); border-radius: 2px; }
.range .new { position: absolute; left: 30%; top: 11px; height: 4px; width: 20%; background: var(--accent); }
.range .knob { position: absolute; left: calc(50% - 11px); top: 2px; width: 22px; height: 22px; border-radius: 50%; background: var(--text); }
.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border-radius: 12px; padding: 6px; }
.stepper span { width: 40px; height: 40px; border-radius: 9px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.stepper b { font-size: 26px; }
.quote { border-radius: 12px; background: var(--surface); padding: 14px; }
.quote .money { font-size: 28px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); }
td:last-child { text-align: right; }
.section-title { max-width: 900px; margin: 48px auto 20px; font: 600 20px/1.2 var(--serif); color: var(--text); }
</style>
</head>

     Тексти — чернетка. Карта сайту: <code>doc/sitemap.md</code>.</p>
