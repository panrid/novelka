# INI data, never sourced as shell. Only enabled engines may be selected.
# Leave engine=auto and keep one name in enabled to use a single provider.
# auto selects the first enabled name; no probing, retries or provider fallback.
[launcher]
engine = auto
enabled = claude, codex, antigravity

# Time/input limits are hard; reported-token threshold is a post-call review gate.
# These are NOT a hard provider token cap or a monetary estimate.
[limits]
timeout_seconds = 600
review_input_bytes = 12000
max_prompt_bytes = 24000
review_tokens = 50000

[models.claude]
fast = haiku
standard = sonnet
strong = opus

# CLI model slugs, not dated snapshots; account access must be checked separately.
[models.codex]
fast = gpt-6-luna
standard = gpt-6.1-sol
strong = gpt-6-astra

# Slugs obtained from agy models. Effort suffix must match the profile effort.
[models.antigravity]
fast-low = gemini-3.8-flash-low
fast-medium = gemini-3.8-flash-medium
standard-medium = gemini-4-argon-medium
standard-high = gemini-4-argon-high
strong-high = claude-opus-5-5-high

[claude.механічна]
model = fast
effort = low

[claude.локальна]
model = standard
effort = medium

[claude.функціональна]
model = standard
effort = high

[claude.складна]
model = strong
effort = medium

[claude.архітектурна]
model = strong
effort = high

[claude.критична]
model = strong
effort = high

[claude]
status = CLI_VERIFIED_RUNTIME_UNTESTED

[codex.механічна]
model = fast
effort = low

[codex.локальна]
model = standard
effort = medium

[codex.функціональна]
