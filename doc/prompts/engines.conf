# INI data, never sourced as shell code.
# Switch both model profiles by changing only launcher.engine: claude | codex.
[launcher]
engine = claude

[claude.мала]
model = sonnet
effort = medium

[claude.середня]
model = sonnet
effort = high

[claude.архітектурна]
model = opus
effort = high

# default is a launcher alias: omit --model, use the configured Codex CLI model.
# It does not mean "mid" or "strongest"; set an available alias here if needed.
[codex.мала]
model = default
effort = medium

[codex.середня]
model = default
effort = high

[codex.архітектурна]
model = default
effort = high

[claude]
status = CLI_VERIFIED_RUNTIME_UNTESTED

[codex]
status = CLI_VERIFIED_RUNTIME_UNTESTED
# Verified locally with codex-cli 0.165.0 --help and exec --help.
# Model execution has deliberately not been tested.
