name: Deploy

on:
    push:
        branches: [main]
        # Documents alone change nothing on the site.
        paths-ignore: ['doc/**', '**/*.md']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # A pull request already tested and built exactly this tree (pull-request.yml): deploy its JAR.
    # Anything else is tested and built here: a direct push, main moved after the check, a fork, a manual run.
    # Re-running an old deploy reuses its pull request's JAR while that is kept (7 days), otherwise rebuilds.
    # Only what changed since the last deploy is checked (.github/scripts/changes.sh); the JAR is always built.
    find:
        name: Find checked JAR
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
            pull-requests: read
        outputs:
            run_id: ${{ steps.find.outputs.run_id }}
            pr: ${{ steps.find.outputs.pr }}
            tree: ${{ steps.find.outputs.tree }}
            backend: ${{ steps.changes.outputs.backend }}
            frontend: ${{ steps.changes.outputs.frontend }}
        steps:
            - name: Look for a JAR from a pull request
              id: find
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  full() {
                      echo "Збірка в цьому запуску: $1" | tee -a "$GITHUB_STEP_SUMMARY"
                      exit 0
                  }
                  [ "$GITHUB_EVENT_NAME" = push ] || full "запуск вручну ($GITHUB_EVENT_NAME)"
                  tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha) \
                      || full "не вдалося дізнатися дерево $GITHUB_SHA"
                  echo "tree=$tree" >> "$GITHUB_OUTPUT"
                  runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="novelka-$tree" -F per_page=100 \
                      --jq '.artifacts | map(select(.expired | not)) | sort_by(.created_at) | reverse | .[].workflow_run.id') \
                      || full "не вдалося переглянути артефакти"
                  for run in $runs; do
                      info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" \
                          --jq '[.event, .conclusion, .path, .head_repository.full_name, .head_branch, .head_sha] | @tsv') || continue
                      IFS=$'\t' read -r run_event conclusion path head_repo branch head_sha <<< "$info"
                      # Only a green check of a branch of this repository: a fork can upload any JAR under any name.
                      if [ "$run_event" != pull_request ] || [ "$conclusion" != success ] \
                          || [ "$path" != .github/workflows/pull-request.yml ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
                          continue
                      fi
                      pr=$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=all -f head="${GITHUB_REPOSITORY_OWNER}:$branch" \
                          --jq "map(select(.head.sha == \"$head_sha\"))[0].number // empty") || pr=''
                      { echo "run_id=$run"; echo "pr=$pr"; } >> "$GITHUB_OUTPUT"
                      echo "Готовий JAR з PR #${pr:-?} (запуск $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run, дерево $tree): без тестів і збірки" \
                          | tee -a "$GITHUB_STEP_SUMMARY"
                      exit 0
                  done
                  full "немає перевіреного JAR з pull request для дерева $tree"
            # Blobless: history and trees only, enough to list changed paths.
            - if: steps.find.outputs.run_id == ''
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  filter: blob:none
            - name: What changed since the last deploy
              id: changes
              if: steps.find.outputs.run_id == ''
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/changes.sh

    backend:
        name: Backend tests
        needs: find
        if: needs.find.outputs.run_id == '' && needs.find.outputs.backend == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '25'
                  cache: gradle
            # Integration tests start PostgreSQL through Testcontainers (Docker is on the runner).
            - name: Run tests
              run: ./gradlew :backend:test --no-daemon

    frontend:
        name: Frontend checks and tests
        needs: find
        if: needs.find.outputs.run_id == '' && needs.find.outputs.frontend == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '22.13.1'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci --no-audit --no-fund
            - name: Types, lint and tests
              run: npm run check

    # Builds alongside the tests, not after them; job "deploy" waits for all three.
    package:
        name: Build JAR
        needs: find
        if: needs.find.outputs.run_id == ''
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '25'
                  cache: gradle
            - uses: actions/setup-node@v5
              with:
                  node-version: '22.13.1'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci --no-audit --no-fund
              working-directory: frontend
            - name: Build JAR with the site inside
              run: ./gradlew :backend:bootJar --no-daemon
            # The server puts each page's title and text into these two places (SearchPages); backend tests use a stand-in.
            - name: Page shell the server fills
              run: grep -q -F '<title>Новелка</title>' frontend/dist/index.html && grep -q -F '<div id="root"></div>' frontend/dist/index.html
            - uses: actions/upload-artifact@v4
              with:
                  name: novelka
                  path: backend/build/libs/novelka.jar
                  if-no-files-found: error
                  retention-days: 14

    deploy:
        name: Deploy to VPS
        needs: [find, backend, frontend, package]
        # Either the JAR checked in a pull request, or the build of this run with each check green
        # or skipped on purpose (nothing of its part changed); red, cancelled or skipped otherwise stops it.
        if: >-
            ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.find.result == 'success'
            && (needs.find.outputs.run_id != ''
                || (needs.package.result == 'success'
                    && (needs.backend.result == 'success' || (needs.backend.result == 'skipped' && needs.find.outputs.backend == 'false'))
                    && (needs.frontend.result == 'success' || (needs.frontend.result == 'skipped' && needs.find.outputs.frontend == 'false')))) }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment:
            name: production
            url: https://novelka.in.ua
        permissions:
            contents: read
            actions: read
        # A newer push waits for the running deploy instead of interrupting Docker Compose midway.
        concurrency:
            group: production
            cancel-in-progress: false
        env:
            # The test site is deployed once the owner has set it up on the server and set the repository
            # variable DEV_SITE to «on» (doc/deployment.md, «Тестовий сайт»); until then production only.
            DEV_SITE: ${{ vars.DEV_SITE == 'on' }}
        steps:
            - uses: actions/checkout@v5
            - name: JAR built in this run
              if: needs.find.outputs.run_id == ''
              uses: actions/download-artifact@v4
              with:
                  name: novelka
                  path: release
            - name: JAR from pull request #${{ needs.find.outputs.pr }}
              if: needs.find.outputs.run_id != ''
              uses: actions/download-artifact@v4
              with:
                  name: novelka-${{ needs.find.outputs.tree }}
                  run-id: ${{ needs.find.outputs.run_id }}
                  github-token: ${{ github.token }}
                  path: release
            - name: Configure SSH
              env:
                  DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
                  DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
                  DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
              run: |
                  test -n "$DEPLOY_HOST" || { echo 'DEPLOY_HOST is empty' >&2; exit 1; }
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy
                  chmod 600 ~/.ssh/deploy
                  if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
                      printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
                  else
                      echo '::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the host key offered right now.'
                      ssh-keyscan -4 -T 15 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
                  fi
            # Each build has its own folder on the server: its JAR (the image is built from it once) and the
            # Compose files and scripts of the same commit.
            - name: Upload the build
              env:
                  TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
              run: |
                  build=/opt/novelka/builds/$GITHUB_SHA
                  ssh -i ~/.ssh/deploy "$TARGET" "mkdir -p $build/app $build/infra"
                  scp -i ~/.ssh/deploy release/novelka.jar backend/Dockerfile "$TARGET:$build/app/"
                  scp -i ~/.ssh/deploy infra/production.compose.yaml infra/dev.compose.yaml infra/Caddyfile infra/deploy.sh \
                      "$TARGET:$build/infra/"
            - name: Deploy to the test site
              if: env.DEV_SITE == 'true'
              env:
                  TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
              run: ssh -i ~/.ssh/deploy "$TARGET" "sh /opt/novelka/builds/$GITHUB_SHA/infra/deploy.sh dev $GITHUB_SHA"
            - name: Check the test site and its database
              if: env.DEV_SITE == 'true'
              run: |
                  curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors \
                      https://dev.novelka.in.ua/api/health | tee /dev/stderr | grep -q '"status":"ok"'
            - name: Restart
              env:
                  TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
              run: |
                  # The new version starts beside the old one; the old stops once the new answers (infra/deploy.sh).
                  ssh -i ~/.ssh/deploy "$TARGET" "sh /opt/novelka/builds/$GITHUB_SHA/infra/deploy.sh prod $GITHUB_SHA"
            - name: Check the app and its database
              run: |
                  curl --fail --silent --show-error --retry 20 --retry-delay 5 --retry-all-errors \
                      https://novelka.in.ua/api/health | tee /dev/stderr | grep -q '"status":"ok"'
            - name: Check the public site
              run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null https://novelka.in.ua/
