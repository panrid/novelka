name: Uptime

# Every 15 minutes: is the site up and does it reach its database? A failed run makes
# GitHub send the repository owner an email.
on:
    schedule:
        - cron: '*/15 * * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    health:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Check the app and its database
              run: |
                  curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 \
                      https://novelka.panrid.space/api/health | tee /dev/stderr | grep -q '"status":"ok"'
            - name: Check the public site
              run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 20 -o /dev/null https://novelka.panrid.space/
