name: Pull request checks

# The same tests as before a deploy, without the deploy: a pull request is green before it reaches main.
on:
    pull_request:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend tests
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '25'
                  cache: gradle
            # Integration tests start PostgreSQL through Testcontainers (Docker is on the runner).
            - name: Run tests
              run: ./gradlew :backend:test --no-daemon

    frontend:
        name: Frontend checks and tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '22.13.1'
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci --no-audit --no-fund
            - name: Types, lint and tests
              run: npm run check
