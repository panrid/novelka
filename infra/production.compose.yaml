services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: novelka
      POSTGRES_USER: novelka
      POSTGRES_PASSWORD: ${NOVELKA_DB_PASSWORD}
    volumes:
      - novelka-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelka -d novelka"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NOVELKA_SERVER_ADDRESS: 0.0.0.0
      NOVELKA_SERVER_PORT: 8080
      NOVELKA_SECURE_COOKIES: "true"
      NOVELKA_OWNER_USERNAME: ${NOVELKA_OWNER_USERNAME:-}
      NOVELKA_OWNER_PASSWORD: ${NOVELKA_OWNER_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NOVELKA_DB_URL: jdbc:postgresql://postgres:5432/novelka
      NOVELKA_DB_USER: novelka
      NOVELKA_DB_PASSWORD: ${NOVELKA_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  novelka-data:
  caddy-data:
  caddy-config:
