# Metrics, logs and alerts beside the site (план, етап 23, п. 5; doc/deployment.md, «Метрики, журнали
# й тривоги»): Prometheus, Loki with Alloy, Grafana, node-exporter, postgres-exporter.
#
# A Compose project of its own: the site's deploy (`--remove-orphans`) never touches it, and it never
# touches the site. It joins the site's network only where it must (Prometheus reads the app's metrics
# port, postgres-exporter reads PostgreSQL). Nothing here listens outside the server: Grafana is bound
# to 127.0.0.1 and the owner opens it through an SSH tunnel.
#
# Started by infra/monitoring/up.sh (from infra/deploy.sh), and only once /opt/novelka/.env.monitoring
# exists. Secrets: .env.production (database password) and .env.monitoring (Grafana, Telegram).
name: novelka-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    mem_limit: 400m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=3GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    networks: [default, site]
    logging: *logging

  loki:
    image: grafana/loki:3.5.3
    restart: unless-stopped
    mem_limit: 400m
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    logging: *logging

  # Reads every container's log through Docker and sends it to Loki; the app's lines get a «level».
  alloy:
    image: grafana/alloy:v1.10.1
    restart: unless-stopped
    mem_limit: 200m
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data
    depends_on: [loki]
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    mem_limit: 300m
    # Only on the server itself: the owner comes through `ssh -L 3000:127.0.0.1:3000 …`.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Used only when Grafana starts for the first time; later: grafana cli admin reset-admin-password.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set in .env.monitoring}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Kyiv
      # Read by provisioning/alerting: the bot @novelka_watch_bot and the owner's chat, as for the uptime check.
      WATCH_TELEGRAM_TOKEN: ${WATCH_TELEGRAM_TOKEN:?WATCH_TELEGRAM_TOKEN is not set in .env.monitoring}
      WATCH_TELEGRAM_CHAT_ID: ${WATCH_TELEGRAM_CHAT_ID:?WATCH_TELEGRAM_CHAT_ID is not set in .env.monitoring}
      ALERT_AI_USD_PER_DAY: ${ALERT_AI_USD_PER_DAY:-5}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus, loki]
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
      # The backup's own status files (infra/backup.sh, план п. 8): novelka_backup_* for the alerts.
      # Until they exist node-exporter only reports node_textfile_scrape_error and carries on.
      - --collector.textfile.directory=/backups/status
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - backups:/backups:ro
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    mem_limit: 64m
    environment:
      DATA_SOURCE_URI: postgres:5432/novelka?sslmode=disable
      DATA_SOURCE_USER: novelka
      DATA_SOURCE_PASS: ${NOVELKA_DB_PASSWORD:?NOVELKA_DB_PASSWORD comes from .env.production}
    networks: [default, site]
    logging: *logging

networks:
  # The site's network (Compose project «novelka»), where «app» and «postgres» are.
  site:
    external: true
    name: ${NOVELKA_SITE_NETWORK:-novelka_default}

volumes:
  prometheus:
  loki:
  alloy:
  grafana:
  # The site's backups (Compose project «novelka»), read only.
  backups:
    external: true
    name: novelka_backups
