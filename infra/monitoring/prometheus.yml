# What Prometheus reads and how often. Kept 15 days (compose.yaml). Alerts live in Grafana.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # The app's metrics port (8081, never forwarded by Caddy). «app» resolves to every running copy,
  # so during a deploy both the old and the new one are read.
  - job_name: app
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8081
        refresh_interval: 15s

  # The server: processor, memory, disk, network; and the backup check's file (backup-check.sh).
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
