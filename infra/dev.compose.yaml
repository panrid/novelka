# The test site, dev.novelka.in.ua, beside production on the same server: its own app and mail
# catcher. Production's PostgreSQL (own database and user «novelka_dev»), Caddy and network
# «novelka_default» are shared (production.compose.yaml). Secrets come from /opt/novelka/.env.dev,
# never production's. Service names are unique on the shared network: «app» there is production.
# Runs the image of the last push to main (infra/deploy.sh dev); see doc/deployment.md.
name: novelka-dev

services:
  dev-app:
    image: novelka:dev
    restart: unless-stopped
    stop_grace_period: 30s
    # Production must not feel the test site.
    mem_limit: 1g
    cpus: 0.5
    environment:
      NOVELKA_SERVER_ADDRESS: 0.0.0.0
      NOVELKA_SERVER_PORT: 8080
      NOVELKA_SECURE_COOKIES: "true"
      NOVELKA_PUBLIC_URL: https://dev.novelka.in.ua
      NOVELKA_DB_URL: jdbc:postgresql://postgres:5432/novelka_dev
      NOVELKA_DB_USER: novelka_dev
      NOVELKA_DB_PASSWORD: ${NOVELKA_DB_PASSWORD}
      NOVELKA_MEDIA_DIR: /data/media
      NOVELKA_OWNER_NICK: ${NOVELKA_OWNER_NICK:-}
      NOVELKA_OWNER_EMAIL: ${NOVELKA_OWNER_EMAIL:-}
      NOVELKA_OWNER_PASSWORD: ${NOVELKA_OWNER_PASSWORD:-}
      # A key of its own with a small credit limit.
      NOVELKA_OPENROUTER_KEY: ${OPENROUTER_API_KEY:-}
      NOVELKA_OPENROUTER_MANAGEMENT_KEY: ${OPENROUTER_MANAGEMENT_KEY:-}
      # Letters go only to the catcher below, read by the team at dev.novelka.in.ua/_mail/.
      NOVELKA_MAIL_HOST: dev-mail
      NOVELKA_MAIL_PORT: 1025
      NOVELKA_MAIL_USER: ""
      NOVELKA_MAIL_PASSWORD: ""
      NOVELKA_MAIL_AUTH: "false"
      NOVELKA_MAIL_STARTTLS: "false"
      NOVELKA_MAIL_FROM: "Новелка (тест) <no-reply@dev.novelka.in.ua>"
      NOVELKA_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NOVELKA_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # A bot of its own: production's bot would lose its webhook to the test site.
      NOVELKA_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOVELKA_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    volumes:
      - media:/data/media

  dev-mail:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_WEBROOT: /_mail/
      MP_MAX_MESSAGES: 1000

networks:
  default:
    name: novelka_default
    external: true

volumes:
  media:
