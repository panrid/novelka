# Test environment beside production on the VPS:
# - Connects to the existing postgres service via the shared novelka_default network
# - Uses its own database (dev_novelka) and dedicated credentials from /opt/novelka/.env.dev
# - Served by the shared Caddy at https://dev.novelka.in.ua with noindex header
# - Limits: max 1 GB RAM and 0.5 CPU core
name: novelka-dev

services:
  dev-app:
    build:
      context: ../app
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1024M
    environment:
      NOVELKA_SERVER_ADDRESS: 0.0.0.0
      NOVELKA_SERVER_PORT: 8080
      NOVELKA_SECURE_COOKIES: "true"
      NOVELKA_PUBLIC_URL: ${NOVELKA_PUBLIC_URL:-https://dev.novelka.in.ua}
      NOVELKA_DB_URL: jdbc:postgresql://postgres:5432/dev_novelka
      NOVELKA_DB_USER: dev_novelka
      NOVELKA_DB_PASSWORD: ${NOVELKA_DB_PASSWORD}
      NOVELKA_MEDIA_DIR: /data/media
      NOVELKA_OWNER_NICK: ${NOVELKA_OWNER_NICK:-}
      NOVELKA_OWNER_EMAIL: ${NOVELKA_OWNER_EMAIL:-}
      NOVELKA_OWNER_PASSWORD: ${NOVELKA_OWNER_PASSWORD:-}
      NOVELKA_OPENROUTER_KEY: ${OPENROUTER_API_KEY:-}
      NOVELKA_OPENROUTER_MANAGEMENT_KEY: ${OPENROUTER_MANAGEMENT_KEY:-}
      NOVELKA_MAIL_HOST: ${MAIL_HOST:-}
      NOVELKA_MAIL_PORT: ${MAIL_PORT:-587}
      NOVELKA_MAIL_USER: ${MAIL_USERNAME:-}
      NOVELKA_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOVELKA_MAIL_AUTH: ${MAIL_AUTH:-false}
      NOVELKA_MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      NOVELKA_MAIL_FROM: ${MAIL_FROM:-Новелка Тест <no-reply@dev.novelka.in.ua>}
      NOVELKA_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NOVELKA_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NOVELKA_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOVELKA_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    volumes:
      - media:/data/media
    networks:
      - default

networks:
  default:
    name: novelka_default
    external: true

volumes:
  media:
    name: novelka-dev_media
