services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: novelka
      POSTGRES_USER: novelka
      POSTGRES_PASSWORD: ${NOVELKA_DB_PASSWORD:-novelka}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - novelka-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U novelka -d novelka" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  novelka-data:
