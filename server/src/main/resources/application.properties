spring.application.name=novelka
server.address=${NOVELKA_SERVER_ADDRESS:127.0.0.1}
server.port=${NOVELKA_SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
novelka.database.url=${NOVELKA_DB_URL:jdbc:postgresql://localhost:5432/novelka}
novelka.database.user=${NOVELKA_DB_USER:novelka}
novelka.database.password=${NOVELKA_DB_PASSWORD:novelka}
novelka.owner.username=${NOVELKA_OWNER_USERNAME:}
novelka.owner.password=${NOVELKA_OWNER_PASSWORD:}
novelka.owner.email=${NOVELKA_OWNER_EMAIL:}
novelka.openrouter.key=${OPENROUTER_API_KEY:}
novelka.openrouter.management-key=${OPENROUTER_MANAGEMENT_KEY:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NOVELKA_SECURE_COOKIES:false}
server.tomcat.max-http-form-post-size=16KB
server.forward-headers-strategy=native
# Transactional email (password reset, email confirmation). Without MAIL_HOST letters are only logged.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
novelka.mail.from=${MAIL_FROM:Новелка <no-reply@localhost>}
# Base of links in letters, without a trailing slash.
novelka.public-url=${NOVELKA_PUBLIC_URL:http://localhost:8080}
