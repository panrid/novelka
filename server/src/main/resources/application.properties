spring.application.name=novelka
server.address=127.0.0.1
server.port=${NOVELKA_SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
novelka.database.url=${NOVELKA_DB_URL:jdbc:postgresql://localhost:5432/novelka}
novelka.database.user=${NOVELKA_DB_USER:novelka}
novelka.database.password=${NOVELKA_DB_PASSWORD:novelka}
