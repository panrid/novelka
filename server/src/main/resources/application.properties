spring.application.name=novelka
server.address=${NOVELKA_SERVER_ADDRESS:127.0.0.1}
server.port=${NOVELKA_SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
novelka.database.url=${NOVELKA_DB_URL:jdbc:postgresql://localhost:5432/novelka}
novelka.database.user=${NOVELKA_DB_USER:novelka}
novelka.database.password=${NOVELKA_DB_PASSWORD:novelka}
novelka.owner.username=${NOVELKA_OWNER_USERNAME:}
novelka.owner.password=${NOVELKA_OWNER_PASSWORD:}
novelka.openrouter.key=${OPENROUTER_API_KEY:}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${NOVELKA_SECURE_COOKIES:false}
server.tomcat.max-http-form-post-size=16KB
server.forward-headers-strategy=native
