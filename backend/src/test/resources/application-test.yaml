novelka:
  limits:
    sign-ins-per-address: 1000
    sign-ins-per-login: 1000
    registrations-per-address: 1000
  # The API's limits (етап 22.2), low enough for a test to reach; PublicApiTests forgets them per case.
  api:
    token-requests-per-minute: 40
    address-requests-per-minute: 40
  media:
    dir: build/test-media
  # Tests run the queue themselves (Worker.drain) instead of on a schedule.
  autotranslate:
    worker: false
  # Tests count achievements themselves (Achievements.sweep).
  achievements:
    sweep: false
  # Tests recount popularity themselves (EditionStats.recount).
  stats:
    recount: false
  # Tests tell subscribers about new chapters themselves (ChapterNewsQueue.drain).
  notifications:
    chapter-news: false
  # Tests post updates to the webhook themselves; the fake bot needs a token to derive its secret.
  # They send the queued messages about new chapters themselves too (TelegramQueue.drain).
  telegram:
    bot-token: test-token
    bot-username: novelka_test_bot
    mode: "off"
    outbox: false
server:
  # Open event streams must not hold the test JVM for the graceful-shutdown timeout.
  shutdown: immediate
