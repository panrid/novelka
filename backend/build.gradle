import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'net.ltgt.errorprone' version '5.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def bootVersion = '4.1.1'
def modulithVersion = '2.1.1'

sourceSets {
    // Standalone generator: migrations -> temporary PostgreSQL -> jOOQ classes.
    codegen
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:$bootVersion")
    implementation platform("org.springframework.modulith:spring-modulith-bom:$modulithVersion")

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.springframework.modulith:spring-modulith-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.jsoup:jsoup:1.23.2'
    // The API's OpenAPI description from the controllers (етап 22.4); no Swagger UI, the site renders it.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.1'
    // Reads WebP and unusual JPEGs (CMYK, broken metadata) that plain ImageIO rejects.
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-jpeg:3.15.3'

    developmentOnly platform("org.springframework.boot:spring-boot-dependencies:$bootVersion")
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation platform("org.springframework.boot:spring-boot-dependencies:$bootVersion")
    testImplementation platform("org.springframework.modulith:spring-modulith-bom:$modulithVersion")
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-restclient'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    codegenImplementation platform("org.springframework.boot:spring-boot-dependencies:$bootVersion")
    codegenImplementation 'org.testcontainers:testcontainers-postgresql'
    codegenImplementation 'org.flywaydb:flyway-core'
    codegenImplementation 'org.flywaydb:flyway-database-postgresql'
    codegenImplementation 'org.jooq:jooq-codegen'
    codegenRuntimeOnly 'org.postgresql:postgresql'
    codegenRuntimeOnly 'org.slf4j:slf4j-simple'

    // Code checks while compiling (план, етап 23, п. 7): seconds, not a separate step.
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.2'
    compileOnly 'org.jspecify:jspecify:1.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-parameters', '-Xlint:all,-processing,-serial'])
    // Error Prone's own errors stop the build; its warnings only show. jOOQ's generated classes are not ours.
    // NullAway checks the packages marked @NullMarked (package-info.java); more of them join one by one.
    options.errorprone {
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*/generated-sources/.*'
        check('NullAway', name == 'compileJava' ? CheckSeverity.ERROR : CheckSeverity.OFF)
        option('NullAway:OnlyNullMarked', 'true')
    }
}

// The jOOQ generator runs before the code it generates exists: no checks there.
tasks.named('compileCodegenJava') {
    options.errorprone.enabled = false
}

def migrations = layout.projectDirectory.dir('src/main/resources/db/migration')
def jooqOutput = layout.buildDirectory.dir('generated-sources/jooq')

def generateJooq = tasks.register('generateJooq', JavaExec) {
    description = 'Applies Flyway migrations to a temporary PostgreSQL and generates jOOQ classes.'
    group = 'build'
    classpath = sourceSets.codegen.runtimeClasspath
    mainClass = 'space.panrid.novelka.codegen.JooqGenerator'
    inputs.dir(migrations).withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(sourceSets.codegen.runtimeClasspath).withNormalizer(ClasspathNormalizer)
    outputs.dir(jooqOutput)
    outputs.cacheIf { true }
    def migrationsPath = migrations.asFile.absolutePath
    def outputPath = jooqOutput.get().asFile.absolutePath
    args migrationsPath, outputPath, 'space.panrid.novelka.jooq'
    // The PostgreSQL JDBC driver sends the JVM zone; "Europe/Kiev" from macOS is rejected.
    jvmArgs '-Duser.timezone=UTC'
}

sourceSets.main.java.srcDir(generateJooq)

// Test classes run in several JVMs at once; each has its own Spring context and its own PostgreSQL
// container, so they share no data. Half the cores (at most 4) by default; -PtestForks=N overrides.
def testForks = providers.gradleProperty('testForks').map { it as int }
        .getOrElse(Math.min(4, Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))))

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '-Duser.timezone=UTC'
    maxParallelForks = testForks
    // The API description's snapshot (ApiDescriptionTests); `-PupdateApiSnapshot` rewrites it from the code.
    def apiSnapshot = rootProject.layout.projectDirectory.file('doc/api/openapi-v1.json')
    inputs.files(apiSnapshot).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('apiSnapshot')
    systemProperty 'novelka.apiSnapshot', apiSnapshot.asFile.absolutePath
    systemProperty 'novelka.updateApiSnapshot', providers.gradleProperty('updateApiSnapshot').isPresent()
    // A failed test shows its message in the build log, so CI tells why without the report.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('bootRun') {
    jvmArgs '-Duser.timezone=UTC'
}

// Frontend lives in ../frontend with its own package.json; Gradle only drives npm.
def frontendDir = rootProject.layout.projectDirectory.dir('frontend')

def npmInstall = tasks.register('npmInstall', Exec) {
    description = 'Installs frontend dependencies exactly as locked.'
    group = 'frontend'
    workingDir frontendDir
    commandLine 'npm', 'ci', '--no-audit', '--no-fund'
    inputs.files(frontendDir.file('package.json'), frontendDir.file('package-lock.json'))
    outputs.dir(frontendDir.dir('node_modules'))
}

def frontendSources = [
        frontendDir.dir('src'), frontendDir.dir('public'), frontendDir.file('index.html'),
        frontendDir.file('vite.config.ts'), frontendDir.file('tsconfig.json'),
        frontendDir.file('eslint.config.js'), frontendDir.file('package-lock.json'),
]

def frontendCheck = tasks.register('frontendCheck', Exec) {
    description = 'Type-checks, lints and tests the frontend.'
    group = 'verification'
    dependsOn npmInstall
    workingDir frontendDir
    commandLine 'npm', 'run', 'check'
    inputs.files(frontendSources)
    outputs.upToDateWhen { true }
    def marker = layout.buildDirectory.file('frontend-check.ok')
    outputs.file(marker)
    doLast { marker.get().asFile.text = 'ok' }
}

def frontendBuild = tasks.register('frontendBuild', Exec) {
    description = 'Builds the production frontend bundle.'
    group = 'build'
    dependsOn npmInstall
    workingDir frontendDir
    commandLine 'npm', 'run', 'build'
    inputs.files(frontendSources)
    outputs.dir(frontendDir.dir('dist'))
}

tasks.named('check') {
    dependsOn frontendCheck
}

tasks.named('bootJar') {
    archiveFileName = 'novelka.jar'
    dependsOn frontendBuild
    from(frontendDir.dir('dist')) {
        into 'BOOT-INF/classes/static'
    }
}
